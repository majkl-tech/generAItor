name: VideoGenerator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6,14,22 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Python script
        run: python core/main.py