name: VideoGenerator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6,14,22 * * *"

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python script
        run: python core/main.py